name: crm
description: CRM for managing all personal projects and apps.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3
  google_fonts: ^6.2.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  file_selector: ^1.0.3
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1
  yaml: ^3.1.3
  path: ^1.9.1
  collection: ^1.19.1
  watcher: ^1.1.1
  tray_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  image_path: assets/icon.png
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 48
